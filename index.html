<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<title>رادار الجو والبحر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root {
    --bg: #0a1020;
    --panel: rgba(13, 21, 40, .9);
    --panel-solid: #0d1528;
    --line: #223152;
    --text: #e8eefb;
    --muted: #8fa0c2;
    --accent: #f5b301;
    --mil: #ff5a5a;
    --civ: #52c7ff;
    --ok: #3ddc97;
    --warn: #ffd23f;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Cairo", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; overflow: hidden; }
  #map { position: fixed; inset: 0; direction: ltr; background: var(--bg); }
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.8); }
  .leaflet-container { font-family: inherit; }
  .leaflet-control-attribution { background: rgba(10,16,32,.7) !important; color: var(--muted) !important; font-size: 10px; }
  .leaflet-control-attribution a { color: var(--muted) !important; }

  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---------- Header ---------- */
  .top { position: fixed; z-index: 1000; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px;
    max-width: 560px; margin: 0 auto; padding: 10px; display: grid; gap: 9px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
    background: linear-gradient(145deg, #1b2a4d, #0f1a33); border: 1px solid var(--line); flex: none; }
  .brand-text { display: grid; line-height: 1.25; min-width: 0; flex: 1; }
  .brand-text b { font-size: 16px; font-weight: 700; }
  .brand-text small { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 0 rgba(61,220,151,.6); animation: pulse 2s infinite; }
  .dot.loading { background: var(--accent); animation: blink 1s infinite; }
  .dot.error { background: var(--bad); }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(61,220,151,0); } 100% { box-shadow: 0 0 0 0 rgba(61,220,151,0); } }
  @keyframes blink { 50% { opacity: .35; } }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: #0a1226;
    border: 1px solid var(--line); border-radius: 13px; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 9px 8px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; gap: 7px; font-weight: 600; font-size: 14px; min-height: 40px; }
  .seg button.active { background: var(--accent); color: #17130a; }
  .d { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .d.civ { background: var(--civ); } .d.mil { background: var(--mil); }
  .seg button.active .d { box-shadow: 0 0 0 2px rgba(0,0,0,.25); }

  .search { display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #0a1226;
    border: 1px solid var(--line); border-radius: 13px; min-height: 42px; }
  .search:focus-within { border-color: var(--accent); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 14px; padding: 9px 0; }
  .search input::placeholder { color: #61739a; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: #0a1226; }
  .chip b { color: var(--text); font-weight: 700; }
  .chip.mil b { color: var(--mil); }

  .progress { height: 3px; border-radius: 3px; background: rgba(255,255,255,.06); overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--accent); transform-origin: right; transform: scaleX(0); }
  .progress i.run { animation: fill 10s linear forwards; }
  @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  .note { display: none; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px;
    padding: 8px 10px; border-radius: 10px; background: rgba(255,107,107,.12); border: 1px solid rgba(255,107,107,.35); color: #ffd0d0; }
  .note.show { display: flex; }
  .note.info { background: rgba(82,199,255,.1); border-color: rgba(82,199,255,.3); color: #cdeeff; }
  .note button { border: 1px solid currentColor; background: transparent; border-radius: 8px; padding: 3px 10px; font-size: 12px; }

  /* ---------- Map buttons ---------- */
  .fab { position: fixed; z-index: 900; right: 12px; bottom: calc(40px + env(safe-area-inset-bottom) + var(--sheet-h, 0px));
    display: grid; gap: 8px; transition: bottom .25s ease; }
  .fab button { width: 46px; height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: grid; place-items: center; font-size: 22px; line-height: 1;
    box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .fab button:active { transform: scale(.96); }

  /* ---------- Plane icons ---------- */
  .plane svg { display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.75)); transition: transform .4s linear; }
  .plane.sel svg { filter: drop-shadow(0 0 6px var(--accent)) drop-shadow(0 0 2px var(--accent)); }
  .plane.emerg svg { animation: blink .8s infinite; }

  /* ---------- Bottom sheet ---------- */
  .sheet { position: fixed; z-index: 1001; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto;
    padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); background: var(--panel-solid);
    border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0; box-shadow: 0 -12px 40px rgba(0,0,0,.45);
    transform: translateY(110%); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
  .sheet.open { transform: translateY(0); }
  .grab { width: 40px; height: 4px; border-radius: 4px; background: #2a3a5f; margin: 2px auto 10px; }
  .sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .call { font-size: 24px; font-weight: 700; letter-spacing: .5px; unicode-bidi: plaintext; text-align: right; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .icon-btn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: #0a1226; font-size: 16px; flex: none; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; min-height: 4px; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
  .badge.mil { background: rgba(255,90,90,.15); color: #ff9a9a; border: 1px solid rgba(255,90,90,.4); }
  .badge.civ { background: rgba(82,199,255,.12); color: #9fdcff; border: 1px solid rgba(82,199,255,.35); }
  .badge.emerg { background: rgba(255,210,63,.15); color: var(--warn); border: 1px solid rgba(255,210,63,.45); }
  .badge.gnd { background: rgba(143,160,194,.12); color: var(--muted); border: 1px solid var(--line); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: #0a1226; border: 1px solid var(--line); border-radius: 14px; padding: 9px 12px; display: grid; gap: 1px; min-width: 0; }
  .stat span { font-size: 12px; color: var(--muted); }
  .stat b { font-size: 14.5px; font-weight: 600; overflow-wrap: anywhere; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .btn { min-height: 44px; border-radius: 13px; border: 1px solid var(--accent); background: var(--accent); color: #17130a; font-weight: 700; }
  .btn.ghost { background: transparent; color: var(--text); border-color: var(--line); }
  .btn.on { background: var(--ok); border-color: var(--ok); }

  @media (min-width: 700px) { .top { left: auto; right: 14px; margin: 0; width: 380px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="map"></div>

<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24"><path fill="#f5b301" d="M12 2l2 7 8 4v2l-8-2-1 5 3 2v1l-4-1-4 1v-1l3-2-1-5-8 2v-2l8-4z"/></svg>
    </div>
    <div class="brand-text"><b>رادار الجو والبحر</b><small id="status">جاري التحميل…</small></div>
    <span id="liveDot" class="dot loading" title="حالة الاتصال"></span>
  </div>

  <div class="seg" role="tablist" aria-label="نوع الطائرات">
    <button id="btnAll" role="tab"><i class="d civ"></i>كل الطائرات</button>
    <button id="btnMil" role="tab"><i class="d mil"></i>العسكرية فقط</button>
  </div>

  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8fa0c2" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="ابحث برمز الرحلة أو التسجيل أو النوع" autocomplete="off" autocapitalize="off" spellcheck="false">
  </label>

  <div class="chips">
    <span class="chip"><b id="chTotal">0</b> طائرة معروضة</span>
    <span class="chip mil"><b id="chMil">0</b> عسكرية</span>
  </div>

  <div id="note" class="note" role="status"><span id="noteText"></span><button id="noteBtn" type="button">إعادة المحاولة</button></div>
  <div class="progress"><i id="bar"></i></div>
</header>

<div class="fab" id="fab">
  <button id="bLoc" aria-label="موقعي">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e8eefb" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
  </button>
  <button id="bIn" aria-label="تكبير">+</button>
  <button id="bOut" aria-label="تصغير">−</button>
</div>

<section id="sheet" class="sheet" aria-live="polite">
  <div class="grab"></div>
  <div class="sheet-head">
    <div style="min-width:0">
      <div id="shCall" class="call" dir="ltr">—</div>
      <div id="shSub" class="sub">—</div>
    </div>
    <button id="shClose" class="icon-btn" aria-label="إغلاق">✕</button>
  </div>
  <div id="shBadges" class="badges"></div>
  <div class="grid">
    <div class="stat"><span>الارتفاع</span><b id="stAlt">—</b></div>
    <div class="stat"><span>السرعة</span><b id="stSpd">—</b></div>
    <div class="stat"><span>الاتجاه</span><b id="stHdg">—</b></div>
    <div class="stat"><span>الصعود / الهبوط</span><b id="stVr">—</b></div>
    <div class="stat"><span>رمز Squawk</span><b id="stSq">—</b></div>
    <div class="stat"><span>التسجيل</span><b id="stReg">—</b></div>
  </div>
  <div class="actions">
    <button id="btnFollow" class="btn" type="button">تتبّع الطائرة</button>
    <button id="btnCenter" class="btn ghost" type="button">توسيط على الخريطة</button>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function () {
  "use strict";
  const API = "/api/adsb?p=";
  const REFRESH_MS = 10000;
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = n => Math.round(n).toLocaleString("en");
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  if (typeof L === "undefined") {
    $("status").textContent = "تعذر تحميل مكتبة الخريطة";
    $("liveDot").className = "dot error";
    return;
  }

  /* ---------- Map ---------- */
  const saved = store.get("view", null);
  const map = L.map("map", { zoomControl: false, worldCopyJump: true, minZoom: 3 })
    .setView(saved ? [saved.lat, saved.lng] : [30, 35], saved ? saved.z : 5);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors", maxZoom: 18
  }).addTo(map);
  map.attributionControl.setPrefix(false);
  map.attributionControl.setPosition("bottomleft");

  /* ---------- State ---------- */
  let mode = store.get("mode", "mil");       // "all" | "mil"
  let query = "";
  let lastList = [];
  let selectedHex = null;
  let follow = false;
  let inflight = null;
  let moveTimer = null;
  let hasLoaded = false;
  const markers = new Map();   // hex -> { m, a, key }
  const trails = new Map();    // hex -> [[lat, lon], ...]
  const trailLine = L.polyline([], { color: "#f5b301", weight: 2.5, opacity: .85, dashArray: "4 6" }).addTo(map);

  /* ---------- Helpers ---------- */
  const isMil = a => (a.dbFlags & 1) === 1;
  const isEmerg = a => ["7500", "7600", "7700"].includes(String(a.squawk || "")) || (a.emergency && a.emergency !== "none");
  const callsign = a => (a.flight || "").trim() || a.r || a.hex;
  const sizeForZoom = z => z < 5 ? 20 : z < 7 ? 24 : z < 10 ? 28 : 34;
  const DIRS = ["شمال", "شمال شرق", "شرق", "جنوب شرق", "جنوب", "جنوب غرب", "غرب", "شمال غرب"];

  function iconFor(a, selected) {
    const s = sizeForZoom(map.getZoom());
    const color = isEmerg(a) ? "#ffd23f" : isMil(a) ? "#ff5a5a" : "#52c7ff";
    const rot = Number.isFinite(a.track) ? Math.round(a.track) : 0;
    const cls = "plane" + (selected ? " sel" : "") + (isEmerg(a) ? " emerg" : "");
    const key = [color, rot, selected ? 1 : 0, s].join("|");
    const icon = L.divIcon({
      className: cls, iconSize: [s, s], iconAnchor: [s / 2, s / 2],
      html: '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" style="transform:rotate(' + rot + 'deg)">' +
            '<path fill="' + color + '" stroke="rgba(0,0,0,.55)" stroke-width=".8" d="M12 2l2 7 8 4v2l-8-2-1 5 3 2v1l-4-1-4 1v-1l3-2-1-5-8 2v-2l8-4z"/></svg>'
    });
    return { icon, key };
  }

  function endpoint() {
    if (mode === "mil") return API + "mil";
    const c = map.getCenter();
    const meters = c.distanceTo(map.getBounds().getNorthEast());
    const nm = Math.max(10, Math.min(250, Math.round(meters / 1852)));
    return API + encodeURIComponent("point/" + c.lat.toFixed(3) + "/" + c.lng.toFixed(3) + "/" + nm);
  }

  /* ---------- UI state ---------- */
  function setDot(state) { $("liveDot").className = "dot " + state; }
  function setNote(text, kind, retry) {
    const n = $("note");
    if (!text) { n.className = "note"; return; }
    n.className = "note show" + (kind === "info" ? " info" : "");
    $("noteText").textContent = text;
    $("noteBtn").style.display = retry ? "" : "none";
  }
  function restartBar() {
    const bar = $("bar");
    bar.classList.remove("run");
    void bar.offsetWidth;
    bar.classList.add("run");
  }
  function setModeUI() {
    $("btnAll").classList.toggle("active", mode === "all");
    $("btnMil").classList.toggle("active", mode === "mil");
    $("btnAll").setAttribute("aria-selected", mode === "all");
    $("btnMil").setAttribute("aria-selected", mode === "mil");
  }

  /* ---------- Render ---------- */
  function matches(a, q) {
    return (a.flight || "").toLowerCase().includes(q) || (a.r || "").toLowerCase().includes(q) ||
           (a.t || "").toLowerCase().includes(q) || (a.hex || "").includes(q);
  }

  function render() {
    const q = query.trim().toLowerCase();
    const seen = new Set();
    let mil = 0;

    for (const a of lastList) {
      if (q && !matches(a, q)) continue;
      seen.add(a.hex);
      if (isMil(a)) mil++;

      const t = trails.get(a.hex) || [];
      const last = t[t.length - 1];
      if (!last || last[0] !== a.lat || last[1] !== a.lon) { t.push([a.lat, a.lon]); if (t.length > 40) t.shift(); }
      trails.set(a.hex, t);

      const sel = a.hex === selectedHex;
      const ic = iconFor(a, sel);
      let rec = markers.get(a.hex);
      if (!rec) {
        const m = L.marker([a.lat, a.lon], { icon: ic.icon, keyboard: false });
        m.on("click", () => select(a.hex));
        m.addTo(map);
        rec = { m, a, key: ic.key };
        markers.set(a.hex, rec);
      } else {
        rec.m.setLatLng([a.lat, a.lon]);
        if (rec.key !== ic.key) { rec.m.setIcon(ic.icon); rec.key = ic.key; }
        rec.a = a;
      }
    }
    for (const [hex, rec] of markers) {
      if (!seen.has(hex)) { map.removeLayer(rec.m); markers.delete(hex); }
    }
    if (trails.size > 1500) {
      for (const hex of trails.keys()) if (!seen.has(hex) && hex !== selectedHex) trails.delete(hex);
    }

    $("chTotal").textContent = fmt(seen.size);
    $("chMil").textContent = fmt(mil);

    if (hasLoaded) {
      if (seen.size === 0 && q) setNote("لا توجد نتائج مطابقة للبحث.", "info", false);
      else if (seen.size === 0) setNote(mode === "all" ? "لا توجد طائرات في هذه المنطقة الآن، حرّك الخريطة أو كبّرها." : "لا توجد طائرات عسكرية معروضة الآن.", "info", false);
      else setNote("");
    }
    updateSheet();
  }

  /* ---------- Data ---------- */
  async function refresh() {
    if (inflight) inflight.abort();
    const ctrl = new AbortController();
    inflight = ctrl;
    setDot("loading");
    try {
      const res = await fetch(endpoint(), { signal: ctrl.signal });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      lastList = (data.ac || []).filter(a => a.lat != null && a.lon != null && a.hex);
      hasLoaded = true;
      render();
      setDot("ok");
      $("status").textContent = "آخر تحديث " + new Date().toLocaleTimeString("en-GB");
      restartBar();
    } catch (e) {
      if (e && e.name === "AbortError") return;
      setDot("error");
      $("status").textContent = "انقطع الاتصال بالبيانات";
      setNote("تعذر تحميل البيانات (" + (e && e.message ? e.message : "خطأ") + ")، سنحاول تلقائيًا.", "error", true);
    } finally {
      if (inflight === ctrl) inflight = null;
    }
  }

  /* ---------- Selection / sheet ---------- */
  function refreshIcon(hex) {
    const rec = markers.get(hex);
    if (!rec) return;
    const ic = iconFor(rec.a, hex === selectedHex);
    rec.m.setIcon(ic.icon); rec.key = ic.key;
  }

  function select(hex) {
    const prev = selectedHex;
    selectedHex = hex;
    follow = false;
    if (prev && prev !== hex) refreshIcon(prev);
    refreshIcon(hex);
    $("sheet").classList.add("open");
    updateSheet();
    requestAnimationFrame(() => document.documentElement.style.setProperty("--sheet-h", ($("sheet").offsetHeight + 10) + "px"));
  }

  function deselect() {
    const prev = selectedHex;
    selectedHex = null;
    follow = false;
    trailLine.setLatLngs([]);
    if (prev) refreshIcon(prev);
    $("sheet").classList.remove("open");
    document.documentElement.style.setProperty("--sheet-h", "0px");
  }

  function updateSheet() {
    if (!selectedHex) return;
    const rec = markers.get(selectedHex);
    $("btnFollow").textContent = follow ? "إيقاف التتبّع" : "تتبّع الطائرة";
    $("btnFollow").classList.toggle("on", follow);
    if (!rec) {
      $("shSub").textContent = "فقدنا إشارة هذه الطائرة حاليًا";
      trailLine.setLatLngs(trails.get(selectedHex) || []);
      return;
    }
    const a = rec.a;
    $("shCall").textContent = callsign(a);
    const sub = [a.desc ||
