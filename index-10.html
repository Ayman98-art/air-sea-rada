<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<title>رادار الجو والبحر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root {
    --bg: #0a1020;
    --panel: rgba(13, 21, 40, .9);
    --panel-solid: #0d1528;
    --line: #223152;
    --text: #e8eefb;
    --muted: #8fa0c2;
    --accent: #f5b301;
    --mil: #ff5a5a;
    --civ: #52c7ff;
    --ok: #3ddc97;
    --warn: #ffd23f;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Cairo", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; overflow: hidden; }
  #map { position: fixed; inset: 0; direction: ltr; background: var(--bg); }
  #map.osm .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.8); }
  .leaflet-overlay-pane img.leaflet-tile { pointer-events: none; }
  .leaflet-container { font-family: inherit; }
  .leaflet-control-attribution { background: rgba(10,16,32,.7) !important; color: var(--muted) !important; font-size: 10px; }
  .leaflet-control-attribution a { color: var(--muted) !important; }

  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---------- Header ---------- */
  .top { position: fixed; z-index: 1000; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px;
    max-width: 560px; margin: 0 auto; padding: 10px; display: grid; gap: 9px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
    background: linear-gradient(145deg, #1b2a4d, #0f1a33); border: 1px solid var(--line); flex: none; }
  .brand-text { display: grid; line-height: 1.25; min-width: 0; flex: 1; }
  .brand-text b { font-size: 16px; font-weight: 700; }
  .brand-text small { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 0 rgba(61,220,151,.6); animation: pulse 2s infinite; }
  .dot.loading { background: var(--accent); animation: blink 1s infinite; }
  .dot.error { background: var(--bad); }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(61,220,151,0); } 100% { box-shadow: 0 0 0 0 rgba(61,220,151,0); } }
  @keyframes blink { 50% { opacity: .35; } }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: #0a1226;
    border: 1px solid var(--line); border-radius: 13px; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 9px 8px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; gap: 7px; font-weight: 600; font-size: 14px; min-height: 40px; }
  .seg button.active { background: var(--accent); color: #17130a; }
  .d { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .d.civ { background: var(--civ); } .d.mil { background: var(--mil); }
  .seg button.active .d { box-shadow: 0 0 0 2px rgba(0,0,0,.25); }
  .seg.three { grid-template-columns: 1fr 1fr 1fr; }
  .seg.three button { font-size: 13.5px; padding: 8px 4px; min-height: 38px; }
  .hide { display: none !important; }
  .d.ship { background: var(--ok); }
  .chip.ship b { color: var(--ok); }
  .ship svg { display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.75)); }
  .ship.sel svg { filter: drop-shadow(0 0 6px var(--accent)) drop-shadow(0 0 2px var(--accent)); }
  .badge.ship { background: rgba(255,255,255,.05); color: #9ff0cb; border: 1px solid rgba(61,220,151,.35); }
  .ship { overflow: visible; }
  .ship svg { filter: drop-shadow(0 1px 2px rgba(0,0,0,.85)); }
  .slabel { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 1px; white-space: nowrap;
    font-size: 10.5px; font-weight: 600; color: #e8eefb; direction: ltr; pointer-events: none;
    text-shadow: 0 0 3px #000, 0 0 2px #000, 0 1px 2px #000; }
  .cats { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 1px; align-items: center; }
  .cats::-webkit-scrollbar { display: none; }
  .cats button { flex: none; display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #0a1226;
    color: var(--muted); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; font-weight: 600; }
  .cats button.active { border-color: var(--accent); color: var(--text); background: rgba(245,179,1,.12); }
  .cats button em { font-style: normal; font-weight: 700; color: var(--text); opacity: .8; }
  .cats button em:empty { display: none; }
  .cat-note { flex: none; display: flex; align-items: center; gap: 5px; font-size: 11px; color: #61739a; padding: 0 4px; }

  .search { display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #0a1226;
    border: 1px solid var(--line); border-radius: 13px; min-height: 42px; }
  .search:focus-within { border-color: var(--accent); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 14px; padding: 9px 0; }
  .search input::placeholder { color: #61739a; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: #0a1226; }
  .chip b { color: var(--text); font-weight: 700; }
  .chip.mil b { color: var(--mil); }

  .progress { height: 3px; border-radius: 3px; background: rgba(255,255,255,.06); overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--accent); transform-origin: right; transform: scaleX(0); }
  .progress i.run { animation: fill 10s linear forwards; }
  @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  .note { display: none; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px;
    padding: 8px 10px; border-radius: 10px; background: rgba(255,107,107,.12); border: 1px solid rgba(255,107,107,.35); color: #ffd0d0; }
  .note.show { display: flex; }
  .note.info { background: rgba(82,199,255,.1); border-color: rgba(82,199,255,.3); color: #cdeeff; }
  .note button { border: 1px solid currentColor; background: transparent; border-radius: 8px; padding: 3px 10px; font-size: 12px; }

  /* ---------- Map buttons ---------- */
  .fab { position: fixed; z-index: 900; right: 12px; bottom: calc(40px + env(safe-area-inset-bottom) + var(--sheet-h, 0px));
    display: grid; gap: 8px; transition: bottom .25s ease; }
  .fab button { width: 46px; height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: grid; place-items: center; font-size: 22px; line-height: 1;
    box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .fab button:active { transform: scale(.96); }

  /* ---------- Plane icons ---------- */
  .plane svg { display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.75)); transition: transform .4s linear; }
  .plane.sel svg { filter: drop-shadow(0 0 6px var(--accent)) drop-shadow(0 0 2px var(--accent)); }
  .plane.emerg svg { animation: blink .8s infinite; }

  /* ---------- Bottom sheet ---------- */
  .sheet { position: fixed; z-index: 1001; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto;
    padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); background: var(--panel-solid);
    border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0; box-shadow: 0 -12px 40px rgba(0,0,0,.45);
    transform: translateY(110%); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
  .sheet.open { transform: translateY(0); }
  .grab { width: 40px; height: 4px; border-radius: 4px; background: #2a3a5f; margin: 2px auto 10px; }
  .sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .call { font-size: 24px; font-weight: 700; letter-spacing: .5px; unicode-bidi: plaintext; text-align: right; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .icon-btn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: #0a1226; font-size: 16px; flex: none; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; min-height: 4px; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
  .badge.mil { background: rgba(255,90,90,.15); color: #ff9a9a; border: 1px solid rgba(255,90,90,.4); }
  .badge.civ { background: rgba(82,199,255,.12); color: #9fdcff; border: 1px solid rgba(82,199,255,.35); }
  .badge.emerg { background: rgba(255,210,63,.15); color: var(--warn); border: 1px solid rgba(255,210,63,.45); }
  .badge.gnd { background: rgba(143,160,194,.12); color: var(--muted); border: 1px solid var(--line); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: #0a1226; border: 1px solid var(--line); border-radius: 14px; padding: 9px 12px; display: grid; gap: 1px; min-width: 0; }
  .stat span { font-size: 12px; color: var(--muted); }
  .stat b { font-size: 14.5px; font-weight: 600; overflow-wrap: anywhere; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .btn { min-height: 44px; border-radius: 13px; border: 1px solid var(--accent); background: var(--accent); color: #17130a; font-weight: 700; }
  .btn.ghost { background: transparent; color: var(--text); border-color: var(--line); }
  .btn.on { background: var(--ok); border-color: var(--ok); }

  @media (min-width: 700px) { .top { left: auto; right: 14px; margin: 0; width: 380px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="map"></div>

<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24"><path fill="#f5b301" d="M12 2l2 7 8 4v2l-8-2-1 5 3 2v1l-4-1-4 1v-1l3-2-1-5-8 2v-2l8-4z"/></svg>
    </div>
    <div class="brand-text"><b>رادار الجو والبحر</b><small id="status">جاري التحميل…</small></div>
    <span id="liveDot" class="dot loading" title="حالة الاتصال"></span>
  </div>

  <div class="seg three" role="tablist" aria-label="ماذا تعرض">
    <button id="lyAir" role="tab"><i class="d civ"></i>طائرات</button>
    <button id="lySea" role="tab"><i class="d ship"></i>سفن</button>
    <button id="lyBoth" role="tab">الاثنين</button>
  </div>

  <div class="cats" id="shipCats" role="tablist" aria-label="نوع السفن"></div>

  <div class="seg" id="planeSeg" role="tablist" aria-label="نوع الطائرات">
    <button id="btnAll" role="tab"><i class="d civ"></i>كل الطائرات</button>
    <button id="btnMil" role="tab"><i class="d mil"></i>العسكرية فقط</button>
  </div>

  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8fa0c2" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="ابحث برمز الرحلة أو اسم السفينة أو النوع" autocomplete="off" autocapitalize="off" spellcheck="false">
  </label>

  <div class="chips">
    <span class="chip" id="cpTotal"><b id="chTotal">0</b> طائرة معروضة</span>
    <span class="chip mil" id="cpMil"><b id="chMil">0</b> عسكرية</span>
    <span class="chip ship" id="cpShip"><b id="chShip">0</b> <span id="chShipTxt">سفينة</span></span>
  </div>

  <div id="note" class="note" role="status"><span id="noteText"></span><button id="noteBtn" type="button">إعادة المحاولة</button></div>
  <div class="progress"><i id="bar"></i></div>
</header>

<div class="fab" id="fab">
  <button id="bLoc" aria-label="موقعي">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e8eefb" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
  </button>
  <button id="bIn" aria-label="تكبير">+</button>
  <button id="bOut" aria-label="تصغير">−</button>
</div>

<section id="sheet" class="sheet" aria-live="polite">
  <div class="grab"></div>
  <div class="sheet-head">
    <div style="min-width:0">
      <div id="shCall" class="call" dir="ltr">—</div>
      <div id="shSub" class="sub">—</div>
    </div>
    <button id="shClose" class="icon-btn" aria-label="إغلاق">✕</button>
  </div>
  <div id="shBadges" class="badges"></div>
  <div class="grid">
    <div class="stat"><span>الارتفاع</span><b id="stAlt">—</b></div>
    <div class="stat"><span>السرعة</span><b id="stSpd">—</b></div>
    <div class="stat"><span>الاتجاه</span><b id="stHdg">—</b></div>
    <div class="stat"><span>الصعود / الهبوط</span><b id="stVr">—</b></div>
    <div class="stat"><span>رمز Squawk</span><b id="stSq">—</b></div>
    <div class="stat"><span>التسجيل</span><b id="stReg">—</b></div>
  </div>
  <div class="actions">
    <button id="btnFollow" class="btn" type="button">تتبّع الطائرة</button>
    <button id="btnCenter" class="btn ghost" type="button">توسيط على الخريطة</button>
  </div>
</section>

<script>
(function () {
  var JS = [
    "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js",
    "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js",
    "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ];
  var CSS = [
    "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css",
    "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css",
    "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  ];
  function say(t, bad) {
    var s = document.getElementById("status"); if (s) s.textContent = t;
    var d = document.getElementById("liveDot"); if (d && bad) d.className = "dot error";
  }
  window.addEventListener("error", function (e) { if (e && e.message) say("خطأ: " + e.message, true); });

  function tryLoad(kind, urls, cb) {
    var i = 0;
    (function next() {
      if (i >= urls.length) { cb(false); return; }
      var url = urls[i++], done = false, el, t;
      function fin(ok) {
        if (done) return;
        done = true; clearTimeout(t);
        if (!ok && el && el.parentNode) el.parentNode.removeChild(el);
        if (ok) cb(true); else next();
      }
      t = setTimeout(function () { fin(false); }, 7000);
      el = document.createElement(kind === "js" ? "script" : "link");
      if (kind === "js") { el.src = url; } else { el.rel = "stylesheet"; el.href = url; }
      el.onload = function () { fin(true); };
      el.onerror = function () { fin(false); };
      document.head.appendChild(el);
    })();
  }

  var jsOk = null, cssOk = null;
  function go() {
    if (jsOk === null || cssOk === null) return;
    if (!jsOk) { say("تعذر تحميل مكتبة الخريطة، تحقق من الإنترنت", true); return; }
    try { start(); } catch (e) { say("خطأ: " + (e && e.message ? e.message : e), true); }
  }
  tryLoad("css", CSS, function (ok) { cssOk = ok; go(); });
  tryLoad("js", JS, function (ok) { jsOk = ok; go(); });

  function start() {
  "use strict";
  const API = "/api/adsb?p=";
  const REFRESH_MS = 10000;
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = n => Math.round(n).toLocaleString("en");
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  if (typeof L === "undefined") {
    $("status").textContent = "تعذر تحميل مكتبة الخريطة";
    $("liveDot").className = "dot error";
    return;
  }

  /* ---------- Map ---------- */
  const saved = store.get("view", null);
  const map = L.map("map", { zoomControl: false, worldCopyJump: true, minZoom: 3 })
    .setView(saved ? [saved.lat, saved.lng] : [30, 35], saved ? saved.z : 5);
  // Dark basemap (Esri, no key). If its tiles fail to load, fall back to OpenStreetMap
  // shown dark with a CSS filter, so the map is never blank.
  const darkBase = L.tileLayer("https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
    attribution: "Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors", maxNativeZoom: 16, maxZoom: 18
  });
  const darkLabels = L.tileLayer("https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
    maxNativeZoom: 16, maxZoom: 18, pane: "overlayPane", opacity: .9
  });
  let tileOk = 0, tileBad = 0, usingOsm = false;
  function useOsm() {
    if (usingOsm) return;
    usingOsm = true;
    map.removeLayer(darkBase); map.removeLayer(darkLabels);
    document.getElementById("map").classList.add("osm");
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors", maxZoom: 18
    }).addTo(map);
  }
  darkBase.on("tileload", () => { tileOk++; });
  darkBase.on("tileerror", () => { if (++tileBad >= 4 && tileOk === 0) useOsm(); });
  darkBase.addTo(map);
  darkLabels.addTo(map);
  setTimeout(() => { if (tileOk === 0) useOsm(); }, 8000);
  map.attributionControl.setPrefix(false);
  map.attributionControl.setPosition("bottomleft");

  /* ---------- State ---------- */
  let mode = store.get("mode", "mil");       // "all" | "mil"
  let query = "";
  let lastList = [];
  let selectedHex = null;
  let follow = false;
  let inflight = null;
  let moveTimer = null;
  let hasLoaded = false;
  const markers = new Map();   // hex -> { m, a, key }
  const trails = new Map();    // hex -> [[lat, lon], ...]
  const trailLine = L.polyline([], { color: "#f5b301", weight: 2.5, opacity: .85, dashArray: "4 6" }).addTo(map);

  /* ---------- Helpers ---------- */
  const isMil = a => (a.dbFlags & 1) === 1;
  const isEmerg = a => ["7500", "7600", "7700"].includes(String(a.squawk || "")) || (a.emergency && a.emergency !== "none");
  const callsign = a => (a.flight || "").trim() || a.r || a.hex;
  const sizeForZoom = z => z < 5 ? 20 : z < 7 ? 24 : z < 10 ? 28 : 34;
  const DIRS = ["شمال", "شمال شرق", "شرق", "جنوب شرق", "جنوب", "جنوب غرب", "غرب", "شمال غرب"];

  function iconFor(a, selected) {
    const s = sizeForZoom(map.getZoom());
    const color = isEmerg(a) ? "#ffd23f" : isMil(a) ? "#ff5a5a" : "#52c7ff";
    const rot = Number.isFinite(a.track) ? Math.round(a.track) : 0;
    const cls = "plane" + (selected ? " sel" : "") + (isEmerg(a) ? " emerg" : "");
    const key = [color, rot, selected ? 1 : 0, s].join("|");
    const icon = L.divIcon({
      className: cls, iconSize: [s, s], iconAnchor: [s / 2, s / 2],
      html: '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" style="transform:rotate(' + rot + 'deg)">' +
            '<path fill="' + color + '" stroke="rgba(0,0,0,.55)" stroke-width=".8" d="M12 2l2 7 8 4v2l-8-2-1 5 3 2v1l-4-1-4 1v-1l3-2-1-5-8 2v-2l8-4z"/></svg>'
    });
    return { icon, key };
  }

  function endpoint() {
    if (mode === "mil") return API + "mil";
    // Snap the query to a shared grid so visitors looking at nearby areas send
    // identical URLs and get served from the cache instead of a new upstream call.
    const c = map.getCenter();
    const need = c.distanceTo(map.getBounds().getNorthEast()) / 1852 * 1.3;
    const nm = [25, 50, 100, 150, 250].find(r => r >= need) || 250;
    const step = nm / 120; // grid cell (degrees) ≈ quarter of radius, keeps the view covered
    const lat = Math.max(-85, Math.min(85, Math.round(c.lat / step) * step));
    const lng = ((Math.round(c.lng / step) * step + 540) % 360) - 180;
    return API + encodeURIComponent("point/" + lat.toFixed(2) + "/" + lng.toFixed(2) + "/" + nm);
  }

  /* ---------- UI state ---------- */
  function setDot(state) { $("liveDot").className = "dot " + state; }
  function setNote(text, kind, retry) {
    const n = $("note");
    if (!text) { n.className = "note"; return; }
    n.className = "note show" + (kind === "info" ? " info" : "");
    $("noteText").textContent = text;
    $("noteBtn").style.display = retry ? "" : "none";
  }
  function restartBar() {
    const bar = $("bar");
    bar.classList.remove("run");
    void bar.offsetWidth;
    bar.classList.add("run");
  }
  function setModeUI() {
    $("btnAll").classList.toggle("active", mode === "all");
    $("btnMil").classList.toggle("active", mode === "mil");
    $("btnAll").setAttribute("aria-selected", mode === "all");
    $("btnMil").setAttribute("aria-selected", mode === "mil");
  }

  /* ---------- Render ---------- */
  function matches(a, q) {
    return (a.flight || "").toLowerCase().includes(q) || (a.r || "").toLowerCase().includes(q) ||
           (a.t || "").toLowerCase().includes(q) || (a.hex || "").includes(q);
  }

  function render() {
    const q = query.trim().toLowerCase();
    const seen = new Set();
    let mil = 0;

    for (const a of lastList) {
      if (q && !matches(a, q)) continue;
      seen.add(a.hex);
      if (isMil(a)) mil++;

      const t = trails.get(a.hex) || [];
      const last = t[t.length - 1];
      if (!last || last[0] !== a.lat || last[1] !== a.lon) { t.push([a.lat, a.lon]); if (t.length > 40) t.shift(); }
      trails.set(a.hex, t);

      const sel = a.hex === selectedHex;
      const ic = iconFor(a, sel);
      let rec = markers.get(a.hex);
      if (!rec) {
        const m = L.marker([a.lat, a.lon], { icon: ic.icon, keyboard: false });
        m.on("click", () => select(a.hex));
        m.addTo(map);
        rec = { m, a, key: ic.key };
        markers.set(a.hex, rec);
      } else {
        rec.m.setLatLng([a.lat, a.lon]);
        if (rec.key !== ic.key) { rec.m.setIcon(ic.icon); rec.key = ic.key; }
        rec.a = a;
      }
    }
    for (const [hex, rec] of markers) {
      if (!seen.has(hex)) { map.removeLayer(rec.m); markers.delete(hex); }
    }
    if (trails.size > 1500) {
      for (const hex of trails.keys()) if (!seen.has(hex) && hex !== selectedHex) trails.delete(hex);
    }

    $("chTotal").textContent = fmt(seen.size);
    $("chMil").textContent = fmt(mil);

    if (hasLoaded) {
      if (seen.size === 0 && q) setNote("لا توجد نتائج مطابقة للبحث.", "info", false);
      else if (seen.size === 0) setNote(mode === "all" ? "لا توجد طائرات في هذه المنطقة الآن، حرّك الخريطة أو كبّرها." : "لا توجد طائرات عسكرية معروضة الآن.", "info", false);
      else setNote("");
    }
    updateSheet();
  }

  /* ---------- Data ---------- */
  async function refresh() {
    if (!showAir()) return;
    if (inflight) inflight.abort();
    const ctrl = new AbortController();
    inflight = ctrl;
    setDot("loading");
    try {
      const res = await fetch(endpoint(), { signal: ctrl.signal });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      lastList = (data.ac || []).filter(a => a.lat != null && a.lon != null && a.hex);
      hasLoaded = true;
      render();
      setDot("ok");
      $("status").textContent = "آخر تحديث " + new Date().toLocaleTimeString("en-GB");
      restartBar();
    } catch (e) {
      if (e && e.name === "AbortError") return;
      setDot("error");
      $("status").textContent = "انقطع الاتصال بالبيانات";
      setNote("تعذر تحميل البيانات (" + (e && e.message ? e.message : "خطأ") + ")، سنحاول تلقائيًا.", "error", true);
    } finally {
      if (inflight === ctrl) inflight = null;
    }
  }

  /* ---------- Selection / sheet ---------- */
  function refreshIcon(hex) {
    const rec = markers.get(hex);
    if (!rec) return;
    const ic = iconFor(rec.a, hex === selectedHex);
    rec.m.setIcon(ic.icon); rec.key = ic.key;
  }

  function setSheetHeight() {
    requestAnimationFrame(() => document.documentElement.style.setProperty("--sheet-h", ($("sheet").offsetHeight + 10) + "px"));
  }

  function select(hex) {
    clearShipSel();
    setLabels(PLANE_LABELS);
    const prev = selectedHex;
    selectedHex = hex;
    follow = false;
    if (prev && prev !== hex) refreshIcon(prev);
    refreshIcon(hex);
    $("sheet").classList.add("open");
    updateSheet();
    setSheetHeight();
  }

  function deselect() {
    clearShipSel();
    const prev = selectedHex;
    selectedHex = null;
    follow = false;
    trailLine.setLatLngs([]);
    if (prev) refreshIcon(prev);
    $("sheet").classList.remove("open");
    document.documentElement.style.setProperty("--sheet-h", "0px");
  }

  function altText(a) {
    if (a.alt_baro === "ground") return "على الأرض";
    const ft = Number.isFinite(a.alt_baro) ? a.alt_baro : a.alt_geom;
    if (!Number.isFinite(ft)) return "—";
    return fmt(ft) + " قدم (" + fmt(ft * 0.3048) + " م)";
  }
  function spdText(a) {
    if (!Number.isFinite(a.gs)) return "—";
    return fmt(a.gs) + " عقدة (" + fmt(a.gs * 1.852) + " كم/س)";
  }
  function hdgText(a) {
    if (!Number.isFinite(a.track)) return "—";
    return Math.round(a.track) + "° " + DIRS[Math.round(a.track / 45) % 8];
  }
  function vrText(a) {
    const v = Number.isFinite(a.baro_rate) ? a.baro_rate : a.geom_rate;
    if (!Number.isFinite(v)) return "—";
    if (Math.abs(v) < 64) return "مستوية";
    return (v > 0 ? "▲ صعود " : "▼ هبوط ") + fmt(Math.abs(v)) + " قدم/د";
  }

  function updateSheet() {
    if (!selectedHex) return;
    const rec = markers.get(selectedHex);
    $("btnFollow").textContent = follow ? "إيقاف التتبّع" : "تتبّع الطائرة";
    $("btnFollow").classList.toggle("on", follow);
    if (!rec) {
      $("shSub").textContent = "فقدنا إشارة هذه الطائرة حاليًا";
      trailLine.setLatLngs(trails.get(selectedHex) || []);
      return;
    }
    const a = rec.a;
    $("shCall").textContent = callsign(a);
    const sub = [a.desc || a.t, a.ownOp, a.year].filter(Boolean).join(" · ");
    $("shSub").textContent = sub || ("ICAO " + a.hex.toUpperCase());

    const badges = [];
    badges.push(isMil(a) ? '<span class="badge mil">عسكرية</span>' : '<span class="badge civ">مدنية</span>');
    if (isEmerg(a)) badges.push('<span class="badge emerg">طوارئ ' + esc(a.squawk || a.emergency) + "</span>");
    if (a.alt_baro === "ground") badges.push('<span class="badge gnd">على الأرض</span>');
    if (a.t) badges.push('<span class="badge gnd" dir="ltr">' + esc(a.t) + "</span>");
    $("shBadges").innerHTML = badges.join("");

    $("stAlt").textContent = altText(a);
    $("stSpd").textContent = spdText(a);
    $("stHdg").textContent = hdgText(a);
    $("stVr").textContent = vrText(a);
    $("stSq").textContent = a.squawk || "—";
    $("stReg").textContent = a.r || a.hex.toUpperCase();

    trailLine.setLatLngs(trails.get(selectedHex) || []);
    if (follow) map.panTo([a.lat, a.lon], { animate: true });
  }

  /* ---------- Ships (AIS) ---------- */
  const SHIP_API = "/api/ships?bbox=";
  const SHIP_REFRESH_MS = 45000;
  const PLANE_LABELS = ["الارتفاع", "السرعة", "الاتجاه", "الصعود / الهبوط", "رمز Squawk", "التسجيل"];
  const SHIP_LABELS = ["النوع", "السرعة", "الاتجاه", "الحالة", "رقم MMSI", "الوجهة"];
  const CATS = {
    cargo:   { name: "شحن",    color: "#51cf66" },
    tanker:  { name: "ناقلات", color: "#ff922b" },
    pass:    { name: "ركاب",   color: "#4dabf7" },
    fish:    { name: "صيد",    color: "#f783ac" },
    mil:     { name: "عسكري",  color: "#ff4d4d" },
    other:   { name: "أخرى",   color: "#e9ecef" },
    unknown: { name: "غير معروف", color: "#7c8aa5" }
  };
  let layer = store.get("layer", "both");      // "air" | "sea" | "both"
  let shipCat = store.get("shipCat", "all");   // "all" | key of CATS
  let shipList = [];
  let shipKey = "";
  const shipLoading = new Set();               // box keys currently being fetched
  let selShip = null;
  const shipMarkers = new Map();               // mmsi -> { m, s, key }
  const shipTrail = L.polyline([], { color: "#f5b301", weight: 2.5, opacity: .85, dashArray: "4 6" }).addTo(map);

  function showAir() { return layer !== "sea"; }
  function showSea() { return layer !== "air"; }
  function setLabels(arr) {
    document.querySelectorAll("#sheet .stat span").forEach((el, i) => { el.textContent = arr[i]; });
  }

  const NAV = { 0: "مبحرة", 1: "راسية بالمخطاف", 2: "خارج السيطرة", 3: "مناورة محدودة", 4: "مقيدة بالغاطس",
    5: "راسية في الميناء", 6: "جانحة", 7: "تصطاد", 8: "مبحرة بالأشرعة" };
  function shipType(t) {
    if (t == null) return null;
    if (t === 35) return "عسكرية";
    if (t === 55) return "إنفاذ قانون";
    if (t === 51) return "بحث وإنقاذ";
    if (t === 30) return "صيد";
    if (t === 31 || t === 32 || t === 52) return "قاطرة";
    if (t === 36) return "شراعية";
    if (t === 37) return "نزهة";
    if (t === 50) return "إرشاد";
    if (t === 58) return "طبية";
    if (t >= 40 && t <= 49) return "سريعة";
    if (t >= 60 && t <= 69) return "ركاب";
    if (t >= 70 && t <= 79) return "شحن";
    if (t >= 80 && t <= 89) return "ناقلة";
    return "أخرى";
  }
  function shipCatOf(s) {
    const t = s.type;
    if (t == null || t === 0) return "unknown";
    if (t === 35) return "mil";
    if (t >= 70 && t <= 79) return "cargo";
    if (t >= 80 && t <= 89) return "tanker";
    if (t >= 60 && t <= 69) return "pass";
    if (t === 30) return "fish";
    return "other";
  }
  const shipName = s => s.name || ("MMSI " + s.mmsi);

  // Top-down ship silhouette pointing north; rotated to the ship's heading.
  const HULL = "M12 1.5c2.7 2.6 3.9 5.7 3.9 8.9v9.6c0 1.4-1 2.5-2.4 2.5h-3c-1.4 0-2.4-1.1-2.4-2.5v-9.6C8.1 7.2 9.3 4.1 12 1.5z";
  function shipIcon(s, selected) {
    const z = map.getZoom();
    const size = z < 6 ? 16 : z < 9 ? 20 : z < 12 ? 26 : 30;
    const color = CATS[shipCatOf(s)].color;
    const moving = s.sog != null && s.sog >= 0.5;
    const dir = s.hdg != null ? s.hdg : (s.cog != null ? s.cog : 0);
    const rot = Math.round(dir / 5) * 5;
    const label = z >= 10 && s.name ? s.name : "";
    const key = [color, rot, moving ? 1 : 0, selected ? 1 : 0, size, label].join("|");
    const svg = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" style="transform:rotate(' + rot + 'deg);opacity:' + (moving ? 1 : .8) + '">' +
      '<path d="' + HULL + '" fill="' + color + '" stroke="rgba(0,0,0,.7)" stroke-width="1"/>' +
      '<rect x="9.7" y="15.2" width="4.6" height="3.4" rx=".8" fill="rgba(0,0,0,.35)"/>' +
      (moving ? "" : '<circle cx="12" cy="11" r="1.6" fill="rgba(0,0,0,.45)"/>') + "</svg>";
    const icon = L.divIcon({
      className: "ship" + (selected ? " sel" : ""), iconSize: [size, size], iconAnchor: [size / 2, size / 2],
      html: svg + (label ? '<span class="slabel">' + esc(label) + "</span>" : "")
    });
    return { icon, key };
  }

  // Snap the visible area to a grid so nearby visitors share one cached request.
  function shipBox() {
    const z = map.getZoom();
    if (z < 5) return null;
    const step = z >= 8 ? 1 : z >= 6 ? 2 : 5;
    const b = map.getBounds().pad(0.15);
    const s = Math.max(-90, Math.floor(b.getSouth() / step) * step);
    const n = Math.min(90, Math.ceil(b.getNorth() / step) * step);
    let w = Math.floor(b.getWest() / step) * step;
    let e = Math.ceil(b.getEast() / step) * step;
    w = Math.max(-180, w); e = Math.min(180, e);
    if ((n - s) * (e - w) > 900) return null;
    return [s, w, n, e].join(",");
  }

  /* Remember the last few areas' ships in the browser so they appear instantly next time. */
  const SHIP_CACHE = "shipCache";
  function cacheGet(key) {
    const c = store.get(SHIP_CACHE, {});
    const e = c && c[key];
    return e && Date.now() - e.t < 30 * 60 * 1000 ? e.list : null;
  }
  function cachePut(key, list) {
    const c = store.get(SHIP_CACHE, {}) || {};
    c[key] = { t: Date.now(), list: list.slice(0, 800).map(s => {
      const o = Object.assign({}, s); delete o.tr; return o;
    }) };
    const keys = Object.keys(c).sort((a, b) => c[b].t - c[a].t);
    for (const k of keys.slice(4)) delete c[k];
    store.set(SHIP_CACHE, c);
  }

  function setShipChip(count, text) {
    $("chShip").textContent = count == null ? "" : fmt(count);
    $("chShipTxt").textContent = text;
  }

  function shipMatches(s, q) {
    return (s.name || "").toLowerCase().includes(q) || String(s.mmsi).includes(q) ||
           (shipType(s.type) || "").includes(q) || (s.dest || "").toLowerCase().includes(q);
  }

  function renderShips() {
    const q = query.trim().toLowerCase();
    const seen = new Set();
    const counts = {};
    if (showSea()) {
      for (const s of shipList) {
        const cat = shipCatOf(s);
        counts[cat] = (counts[cat] || 0) + 1;
        if (shipCat !== "all" && cat !== shipCat) continue;
        if (q && !shipMatches(s, q)) continue;
        seen.add(s.mmsi);
        const ic = shipIcon(s, s.mmsi === selShip);
        let rec = shipMarkers.get(s.mmsi);
        if (!rec) {
          const m = L.marker([s.lat, s.lon], { icon: ic.icon, keyboard: false });
          m.on("click", ev => { L.DomEvent.stopPropagation(ev); selectShip(s.mmsi); });
          m.addTo(map);
          rec = { m, s, key: ic.key };
          shipMarkers.set(s.mmsi, rec);
        } else {
          rec.m.setLatLng([s.lat, s.lon]);
          if (rec.key !== ic.key) { rec.m.setIcon(ic.icon); rec.key = ic.key; }
          rec.s = s;
        }
      }
    }
    for (const [id, rec] of shipMarkers) {
      if (!seen.has(id)) { map.removeLayer(rec.m); shipMarkers.delete(id); }
    }
    document.querySelectorAll("#shipCats [data-cat]").forEach(b => {
      const c = b.dataset.cat;
      const n = c === "all" ? shipList.length : (counts[c] || 0);
      b.querySelector("em").textContent = shipKey ? fmt(n) : "";
    });
    if (showSea() && shipKey) setShipChip(seen.size, "سفينة");
    updateShipSheet();
  }

  async function refreshShips() {
    if (!showSea()) return;
    const key = shipBox();
    if (!key) {
      shipKey = ""; shipList = []; renderShips();
      setShipChip(null, "كبّر الخريطة لعرض السفن");
      return;
    }
    if (key !== shipKey) {
      const cached = cacheGet(key);
      if (cached) { shipKey = key; shipList = cached; renderShips(); }
      else setShipChip(null, "جاري تحميل السفن…");
    }
    if (shipLoading.has(key)) return;            // already on its way; never cancel it
    shipLoading.add(key);
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 25000);
    try {
      const res = await fetch(SHIP_API + encodeURIComponent(key), { signal: ctrl.signal });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const list = (data.ships || []).filter(s => s.lat != null && s.lon != null && s.mmsi);
      cachePut(key, list);
      if (key !== shipBox() || !showSea()) return; // the map moved on meanwhile
      shipKey = key;
      shipList = list;
      renderShips();
      if (!showAir()) {
        setDot("ok");
        $("status").textContent = "آخر تحديث " + new Date().toLocaleTimeString("en-GB");
      }
    } catch (e) {
      if (key !== shipBox()) return;
      if (!shipList.length) setShipChip(null, "تعذر تحميل السفن");
      if (!showAir()) { setDot("error"); $("status").textContent = "انقطع الاتصال ببيانات السفن"; }
    } finally {
      clearTimeout(timer);
      shipLoading.delete(key);
    }
  }

  function refreshShipIcon(id) {
    const rec = shipMarkers.get(id);
    if (!rec) return;
    const ic = shipIcon(rec.s, id === selShip);
    rec.m.setIcon(ic.icon); rec.key = ic.key;
  }
  function clearShipSel() {
    if (selShip == null) return;
    const prev = selShip;
    selShip = null;
    shipTrail.setLatLngs([]);
    refreshShipIcon(prev);
  }
  function selectShip(id) {
    if (selectedHex) deselect();
    const prev = selShip;
    selShip = id;
    follow = false;
    if (prev != null && prev !== id) refreshShipIcon(prev);
    refreshShipIcon(id);
    setLabels(SHIP_LABELS);
    $("sheet").classList.add("open");
    updateShipSheet();
    setSheetHeight();
  }
  function updateShipSheet() {
    if (selShip == null) return;
    $("btnFollow").textContent = follow ? "إيقاف التتبّع" : "تتبّع السفينة";
    $("btnFollow").classList.toggle("on", follow);
    const rec = shipMarkers.get(selShip);
    if (!rec) { $("shSub").textContent = "هذه السفينة خارج المنطقة المعروضة الآن"; return; }
    const s = rec.s;
    $("shCall").textContent = shipName(s);
    const sub = [shipType(s.type) && ("سفينة " + shipType(s.type)), s.cs && ("نداء " + s.cs), s.len && (s.len + " م طولًا")].filter(Boolean).join(" · ");
    $("shSub").textContent = sub || "سفينة";
    const cat = CATS[shipCatOf(s)];
    const badges = ['<span class="badge ship" style="color:' + cat.color + ';border-color:' + cat.color + '66">' + esc(cat.name) + "</span>"];
    if (s.nav === 6 || s.nav === 2) badges.push('<span class="badge emerg">' + esc(NAV[s.nav]) + "</span>");
    $("shBadges").innerHTML = badges.join("");
    $("stAlt").textContent = shipType(s.type) || "غير معروف";
    $("stSpd").textContent = s.sog == null ? "—" : (s.sog.toFixed(1) + " عقدة (" + fmt(s.sog * 1.852) + " كم/س)");
    const dir = s.cog != null ? s.cog : s.hdg;
    $("stHdg").textContent = dir == null ? "—" : (Math.round(dir) + "° " + DIRS[Math.round(dir / 45) % 8]);
    $("stVr").textContent = NAV[s.nav] || "—";
    $("stSq").textContent = String(s.mmsi);
    $("stReg").textContent = s.dest || "—";
    const tr = (s.tr || []).slice();
    const lastPt = tr[tr.length - 1];
    if (!lastPt || lastPt[0] !== s.lat || lastPt[1] !== s.lon) tr.push([s.lat, s.lon]);
    shipTrail.setLatLngs(tr.length > 1 ? tr : []);
    if (follow) map.panTo([s.lat, s.lon], { animate: true });
  }

  function setShipCat(c) {
    if (shipCat === c) return;
    shipCat = c;
    store.set("shipCat", c);
    setShipCatUI();
    if (selShip != null) {
      const rec = shipMarkers.get(selShip);
      if (rec && c !== "all" && shipCatOf(rec.s) !== c) deselect();
    }
    renderShips();
  }
  function setShipCatUI() {
    document.querySelectorAll("#shipCats [data-cat]").forEach(b => b.classList.toggle("active", b.dataset.cat === shipCat));
  }
  (function buildShipCats() {
    const order = ["all", "cargo", "tanker", "pass", "fish", "mil", "other"];
    $("shipCats").innerHTML = order.map(c => {
      const dot = c === "all" ? '<i class="d" style="background:linear-gradient(90deg,#51cf66,#ff922b,#4dabf7,#ff4d4d)"></i>'
                              : '<i class="d" style="background:' + CATS[c].color + '"></i>';
      return '<button type="button" data-cat="' + c + '">' + dot + (c === "all" ? "كل السفن" : CATS[c].name) + "<em></em></button>";
    }).join("") + '<span class="cat-note"><i class="d" style="background:' + CATS.unknown.color + '"></i>رمادي = نوع غير معروف بعد</span>';
    $("shipCats").addEventListener("click", e => {
      const b = e.target.closest("[data-cat]");
      if (b) setShipCat(b.dataset.cat);
    });
  })();

  function setLayerUI() {
    $("lyAir").classList.toggle("active", layer === "air");
    $("lySea").classList.toggle("active", layer === "sea");
    $("lyBoth").classList.toggle("active", layer === "both");
    $("planeSeg").classList.toggle("hide", !showAir());
    $("shipCats").classList.toggle("hide", !showSea());
    $("cpTotal").classList.toggle("hide", !showAir());
    $("cpMil").classList.toggle("hide", !showAir());
    $("cpShip").classList.toggle("hide", !showSea());
    setShipCatUI();
  }
  function setLayer(l) {
    if (layer === l) return;
    layer = l;
    store.set("layer", l);
    setLayerUI();
    if (!showAir()) {
      if (selectedHex) deselect();
      if (inflight) inflight.abort();
      lastList = []; hasLoaded = false; render(); setNote("");
    } else { refresh(); }
    if (!showSea()) {
      if (selShip != null) deselect();
      shipList = []; shipKey = ""; renderShips();
    } else { refreshShips(); }
  }
  $("lyAir").addEventListener("click", () => setLayer("air"));
  $("lySea").addEventListener("click", () => setLayer("sea"));
  $("lyBoth").addEventListener("click", () => setLayer("both"));

  /* ---------- Events ---------- */
  function setMode(m) {
    if (mode === m) return;
    mode = m;
    store.set("mode", m);
    setModeUI();
    lastList = [];
    hasLoaded = false;
    render();
    refresh();
  }
  $("btnAll").addEventListener("click", () => setMode("all"));
  $("btnMil").addEventListener("click", () => setMode("mil"));

  let searchTimer = null;
  $("search").addEventListener("input", e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { query = e.target.value; render(); renderShips(); }, 150);
  });

  $("shClose").addEventListener("click", deselect);
  $("btnFollow").addEventListener("click", () => { follow = !follow; updateSheet(); updateShipSheet(); });
  $("btnCenter").addEventListener("click", () => {
    if (selShip != null) {
      const sr = shipMarkers.get(selShip);
      if (sr) map.setView([sr.s.lat, sr.s.lon], Math.max(map.getZoom(), 9));
      return;
    }
    const rec = markers.get(selectedHex);
    if (rec) map.setView([rec.a.lat, rec.a.lon], Math.max(map.getZoom(), 8));
  });
  $("noteBtn").addEventListener("click", () => { setNote(""); refresh(); });
  $("bIn").addEventListener("click", () => map.zoomIn());
  $("bOut").addEventListener("click", () => map.zoomOut());
  $("bLoc").addEventListener("click", () => {
    if (!navigator.geolocation) { setNote("المتصفح لا يدعم تحديد الموقع.", "info", false); return; }
    navigator.geolocation.getCurrentPosition(
      p => map.setView([p.coords.latitude, p.coords.longitude], 8),
      () => setNote("لم نتمكن من الوصول إلى موقعك.", "info", false),
      { enableHighAccuracy: false, timeout: 8000 }
    );
  });

  map.on("click", () => { if (selectedHex || selShip != null) deselect(); });
  map.on("dragstart", () => { if (follow) { follow = false; updateSheet(); updateShipSheet(); } });
  map.on("zoomend", () => {
    for (const [hex, rec] of markers) {
      const ic = iconFor(rec.a, hex === selectedHex);
      if (rec.key !== ic.key) { rec.m.setIcon(ic.icon); rec.key = ic.key; }
    }
    for (const [id, rec] of shipMarkers) {
      const ic = shipIcon(rec.s, id === selShip);
      if (rec.key !== ic.key) { rec.m.setIcon(ic.icon); rec.key = ic.key; }
    }
  });
  let shipMoveTimer = null;
  map.on("moveend", () => {
    if (showSea() && !follow) {
      clearTimeout(shipMoveTimer);
      shipMoveTimer = setTimeout(() => { if (shipBox() !== shipKey || !shipKey) refreshShips(); }, 700);
    }
    const c = map.getCenter();
    store.set("view", { lat: +c.lat.toFixed(4), lng: +c.lng.toFixed(4), z: map.getZoom() });
    if (mode !== "all" || follow || !showAir()) return;
    clearTimeout(moveTimer);
    moveTimer = setTimeout(refresh, 600);
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && (selectedHex || selShip != null)) deselect(); });
  window.addEventListener("resize", () => { if (selectedHex || selShip != null) setSheetHeight(); });

  /* ---------- Start ---------- */
  setModeUI();
  setLayerUI();
  refresh();
  refreshShips();
  setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS);
  setInterval(() => { if (!document.hidden) refreshShips(); }, SHIP_REFRESH_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { refresh(); refreshShips(); } });
  }
})();
</script>
</body>
</html>
